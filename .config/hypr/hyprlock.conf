# Catppuccin Mocha, mauve accent. The background is the wallpaper on screen,
# which ~/bin/wallpaper links at ~/.cache/wallpaper/current.

$font = FiraCode Nerd Font

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = ~/.cache/wallpaper/current
    color = rgb(1e1e2e) # if the image is missing
    blur_passes = 3
    blur_size = 8
    brightness = 0.6
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 3
    inner_color = rgba(1e1e2ecc)

    outer_color = rgb(cba6f7) rgb(89b4fa) 45deg
    check_color = rgb(a6e3a1)
    fail_color = rgb(f38ba8)
    capslock_color = rgb(f9e2af)

    font_color = rgb(cdd6f4)
    fade_on_empty = false
    rounding = 15

    font_family = $font
    placeholder_text = <span foreground="##6c7086">Password</span>
    fail_text = $PAMFAIL

    dots_spacing = 0.3

    position = 0, -20
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = $TIME
    color = rgb(cdd6f4)
    font_size = 90
    font_family = $font

    position = 0, 200
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    color = rgb(bac2de)
    font_size = 22
    font_family = $font

    position = 0, 110
    halign = center
    valign = center
}

# KEYBOARD LAYOUT
label {
    monitor =
    text = $LAYOUT[us,bg]
    color = rgb(bac2de)
    font_size = 16
    font_family = $font

    position = 0, -90
    halign = center
    valign = center
}
