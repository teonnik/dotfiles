general {
    # pidof guard stops a second locker stacking on top of the first. Output
    # goes to a log: a hyprlock that hangs after unlocking (seen after resume,
    # 21 Oct 2026) also blocks every later lock through this guard
    lock_cmd = pidof hyprlock || hyprlock >> $HOME/.local/state/hyprlock.log 2>&1
    before_sleep_cmd = loginctl lock-session

    # No after_sleep_cmd on purpose: the 360s listener's on-resume already
    # restores DPMS on activity, and nothing blanks the outputs as part of
    # suspend itself. See log/2026-09-16.

    # 3 = hold the sleep inhibitor until the session is actually locked, so
    # the screen never shows unlocked on resume. Needs a session-lock locker
    # (hyprlock); disables on_lock_cmd / on_unlock_cmd, which we don't use.
    inhibit_sleep = 3

    # Load-bearing for the waybar idle-inhibit toggle, which holds a
    # `systemd-inhibit --what=idle` lock. swayidle ignored these entirely.
    ignore_systemd_inhibit = false
}

listener {
    timeout = 180
    on-timeout = notify-send -u critical "Locking screen in 2 minutes." "The system was idle for 3 minutes."
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# The table argument is load-bearing: `dpms("off")` leaves `action` unset and
# powers the outputs down whichever action you name, so on-resume blanks the
# screen instead of waking it. See log/2026-09-16.
listener {
    timeout = 360
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}
