general {
    # pidof guard stops a second locker stacking on top of the first
    lock_cmd = pidof swaylock || swaylock -f
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms("on")'

    # 1 = hold the sleep inhibitor while before_sleep_cmd runs, i.e. swayidle's
    # -w. Mode 2 (auto) only waits for the lock if the command names hyprlock.
    inhibit_sleep = 1

    # Load-bearing for the waybar idle-inhibit toggle, which holds a
    # `systemd-inhibit --what=idle` lock. swayidle ignored these entirely.
    ignore_systemd_inhibit = false
}

listener {
    timeout = 180
    on-timeout = notify-send -u critical "Locking screen in 2 minutes." "The system was idle for 3 minutes."
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# DPMS-off is disabled: on this Meteor Lake box the display does not recover
# cleanly, and hyprsunset/hyprpaper abort when the outputs power down (see
# hyprwm/hyprsunset#65, hyprwm/Hyprland#7276). It had also been silently broken
# since the hyprlang->lua migration, so nothing is actually lost here.
